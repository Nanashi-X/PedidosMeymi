<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEYMI · Arma tu torta</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Dancing+Script:wght@600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --vino: #B3163F;
  --vino-oscuro: #6E0E28;
  --rosa: #FBB9C5;
  --rosa-claro: #FDE6EB;
  --rosa-medio: #E58AA0;
  --fondo: #FFF7F9;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); font-family: 'Nunito', sans-serif; color: var(--vino-oscuro); -webkit-tap-highlight-color: transparent; }
/* iPhone/Safari: quitar el estilo propio de botones y campos para que se vean igual que en Android */
button { font-family: inherit; color: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
input, textarea { -webkit-appearance: none; appearance: none; border-radius: 12px; }
/* En iPhone los campos de fecha y hora vacíos se encogen: se les da alto fijo */
input[type="date"], input[type="time"] { display: block; min-height: 48px; line-height: 24px; text-align: left; }
input::-webkit-date-and-time-value { text-align: left; }
/* Mientras se escribe, la barra de botones deja de estar fija para que el teclado del iPhone no la monte sobre los campos */
body.escribiendo .acciones { position: static; border-top: 0; background: transparent; }
body.escribiendo .app { padding-bottom: 8px; }
/* Aviso discreto «Hay más abajo»: aparece solo si queda contenido por ver; no bloquea nada */
.mas-abajo { position: fixed; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(110, 14, 40, .88); color: #fff; border: 0; border-radius: 20px; padding: 7px 16px; font-family: inherit; font-weight: 900; font-size: 14px; box-shadow: 0 3px 10px rgba(110, 14, 40, .25); cursor: pointer; transition: opacity .25s; display: flex; align-items: center; gap: 6px; }
.mas-abajo.oculto { opacity: 0; pointer-events: none; }
.mas-abajo .flecha { display: inline-block; animation: rebote 1.6s ease-in-out infinite; }
@keyframes rebote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .mas-abajo .flecha { animation: none; } }
.aviso-sin-js { background: #fff; border: 2px solid var(--rosa); border-radius: 16px; padding: 16px; margin-top: 16px; font-weight: 800; line-height: 1.45; text-align: center; }
.app { max-width: 520px; margin: 0 auto; padding: 16px 16px 120px; }

/* Cabecera */
.marca { display: flex; align-items: center; gap: 10px; justify-content: center; }
.marca[hidden] { display: none; }
/* En el resumen los botones van debajo de la tarjeta (no fijos) para no tapar la captura */
body.resumen-activo .app { padding-bottom: 8px; }
body.resumen-activo .acciones { position: static; border-top: 0; background: transparent; padding-top: 4px; }
.marca img { width: 54px; }
.marca-nombre { font-family: 'Lilita One'; font-size: 34px; color: var(--vino); line-height: 1; }
.marca-sub { font-family: 'Dancing Script'; font-size: 18px; color: var(--vino); }

.progreso { margin: 14px 0 6px; }
.progreso-texto { font-family: 'Lilita One'; font-size: 15px; letter-spacing: 2px; color: var(--vino); }
.barras { display: flex; gap: 5px; margin-top: 6px; }
.barra { height: 8px; flex: 1; border-radius: 4px; background: var(--rosa-claro); }
.barra.hecha { background: var(--rosa-medio); }
.barra.actual { background: var(--vino); }

.titulo { font-family: 'Lilita One'; font-size: 34px; color: var(--vino); margin: 14px 0 4px; line-height: 1.05; }
.explica { font-size: 16px; font-weight: 700; margin: 0 0 10px; line-height: 1.4; }
.pildora { font-family: 'Nunito', sans-serif; display: inline-block; background: var(--vino); color: #fff; font-weight: 900; font-size: 14px; padding: 5px 14px; border-radius: 20px; margin: 0 6px 8px 0; }
.pildora.suave { background: var(--rosa-claro); color: var(--vino-oscuro); }
.subtitulo { font-family: 'Lilita One'; font-size: 22px; color: var(--vino); margin: 18px 0 8px; }

/* Opciones */
.rejilla { display: grid; gap: 10px; }
.col-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.col-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opcion { background: #fff; border: 2px solid var(--rosa); border-radius: 16px; padding: 10px 6px; text-align: center; cursor: pointer; position: relative; transition: transform .1s; }
.opcion:active { transform: scale(.97); }
.opcion img, .opcion svg { display: block; margin: 0 auto 6px; }
.opcion img { width: 78%; max-width: 120px; aspect-ratio: 1; border-radius: 50%; }
.opcion-nombre { font-family: 'Lilita One'; font-size: 16px; color: var(--vino); line-height: 1.1; }
.opcion-desc { font-size: 12.5px; font-weight: 700; margin-top: 3px; line-height: 1.25; }
.opcion-etiqueta { font-size: 12px; font-weight: 900; color: var(--vino); margin-top: 3px; }
.opcion[aria-pressed="true"] { border-color: var(--vino); background: var(--rosa-claro); box-shadow: 0 0 0 2px var(--vino) inset; }
.opcion[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 6px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--vino); color: #fff; font-weight: 900; font-size: 15px; line-height: 24px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #fff; border: 2px solid var(--rosa); border-radius: 22px; padding: 8px 16px; font-weight: 900; font-size: 15px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--vino); border-color: var(--vino); color: #fff; }

.lugar-extra { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--rosa); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
.lugar-extra img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.lugar-extra .chip { padding: 6px 12px; font-size: 14px; }
.nota { background: var(--rosa-claro); border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 700; line-height: 1.4; margin-top: 12px; }
.nota b { color: var(--vino); }

/* Campos de texto */
.campo { margin-top: 12px; }
.campo label { display: block; font-weight: 900; font-size: 15px; margin-bottom: 4px; }
.campo small { display: block; font-weight: 700; font-size: 12.5px; color: #8a4a5c; margin-top: 3px; }
.campo input, .campo textarea { width: 100%; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--vino-oscuro); border: 2px solid var(--rosa); border-radius: 12px; padding: 10px 12px; background: #fff; }
.campo input:focus, .campo textarea:focus { outline: none; border-color: var(--vino); }
.campo textarea { min-height: 80px; resize: vertical; }

/* Barra inferior con botones */
.acciones { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid var(--rosa-claro); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.acciones-dentro { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; }
.boton { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 900; font-size: 17px; cursor: pointer; }
.boton.principal { background: var(--vino); color: #fff; }
.boton.secundario { background: var(--rosa-claro); color: var(--vino-oscuro); flex: 0 0 34%; }
.boton.whatsapp { background: #1FA855; color: #fff; }
.error { color: #C0142F; font-weight: 900; font-size: 14px; margin: 0 0 8px; text-align: center; }

/* Resumen para captura */
.resumen { background: #fff; border-radius: 22px; overflow: hidden; border: 3px solid var(--vino); margin-top: 10px; }
.resumen-cabecera { background: var(--vino); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.resumen-cabecera img { width: 42px; background: #fff; border-radius: 50%; padding: 4px; }
.resumen-cabecera .rc-marca { font-family: 'Lilita One'; font-size: 26px; line-height: 1; }
.resumen-cabecera .rc-sub { font-size: 13px; font-weight: 800; opacity: .95; }
.resumen-cabecera .rc-numero { margin-left: auto; text-align: right; font-size: 12px; font-weight: 800; }
.resumen-cabecera .rc-numero b { display: block; font-size: 14px; white-space: nowrap; }
.resumen-cuerpo { padding: 2px 14px 2px; }
.fila { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 2px dotted var(--rosa); }
.fila:last-child { border-bottom: 0; }
.fila-fotos { display: flex; flex: none; }
.fila-fotos img, .fila-fotos svg { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; margin-left: -10px; background: #fff; }
.fila-fotos img:first-child, .fila-fotos svg:first-child { margin-left: 0; }
.fila-texto { flex: 1; min-width: 0; }
.fila-etiqueta { font-size: 11.5px; font-weight: 900; letter-spacing: 1px; color: var(--rosa-medio); text-transform: uppercase; }
.fila-valor { font-size: 15px; font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
.fila-detalle { font-size: 13px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.resumen-entrega { background: var(--rosa-claro); margin: 2px 12px 10px; border-radius: 14px; padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.resumen-pie { background: var(--rosa-claro); text-align: center; padding: 8px 10px 9px; font-size: 13px; font-weight: 800; border-top: 2px solid var(--rosa); }
.resumen-pie b { color: var(--vino); font-size: 16px; }
.consejo { text-align: center; font-weight: 800; font-size: 14px; margin: 12px 0 0; }
</style>
</head>

  { id: 'chantilly', foto: 'relleno_chantilly', nombre: 'Chantilly con fresas', desc: 'crema batida con fresas' },
  { id: 'frosting', foto: 'relleno_frosting', nombre: 'Frosting de queso', desc: 'crema de queso, menos dulce' },
  { id: 'ganache_negro', foto: 'relleno_ganache_negro', nombre: 'Ganache negro', desc: 'chocolate oscuro con crema' },
  { id: 'brigadeiro', foto: 'relleno_brigadeiro', nombre: 'Brigadeiro blanco', desc: 'crema de leche condensada' },
];

const COBERTURAS = [
  { id: 'chantilly', nombre: 'Chantilly', desc: 'crema batida ligera', etiqueta: 'va refrigerada · decoración sencilla' },
  { id: 'buttercream', nombre: 'Buttercream', desc: 'crema de mantequilla', etiqueta: 'firme, acabado liso' },
];

const EXTRAS = [
  { id: 'almendras', foto: 'topping_almendras', nombre: 'Almendras' },
  { id: 'nueces', foto: 'topping_nueces', nombre: 'Nueces' },
  { id: 'gotas_negras', foto: 'topping_gotas_negro', nombre: 'Gotas negras' },
  { id: 'gotas_blancas', foto: 'topping_gotas_blanco', nombre: 'Gotas blancas' },
  { id: 'grageas', foto: 'topping_grageas', nombre: 'Grageas' },
  { id: 'sin', foto: '', nombre: 'Sin extra' },
];

const LUGARES_EXTRA = [
  { id: 'encima', nombre: 'Encima' },
  { id: 'masa', nombre: 'En la masa' },
  { id: 'relleno', nombre: 'En el relleno' },
];

const FORMAS_DECORACION = [
  { id: 'foto', icono: '📷', nombre: 'Te mando una foto', desc: 'de una torta que me guste, por WhatsApp' },
  { id: 'idea', icono: '💬', nombre: 'Les cuento mi idea', desc: 'tema, colores y texto' },
  { id: 'gusto', icono: '⭐', nombre: 'A su gusto', desc: 'diseño sencillo de la casa, sin figuras' },
];

const PASOS = ['Tamaño', 'Sabor de la masa', 'Relleno', 'Cobertura y extras', 'Decoración', 'Tus datos'];

// ===================== Estado del pedido =====================
const pedido = {
  tamano: null, sabor: null, rellenos: [], cobertura: null,
  extras: [], decoracion: null,
  // Lugar de los extras: 'iguales' = el mismo lugar para todos (lugaresExtra);
  // 'separados' = cada extra con su lugar (lugaresPorExtra: { nueces: ['masa'], ... })
  modoLugares: 'iguales', lugaresExtra: [], lugaresPorExtra: {},
  ocasion: '', texto: '', colores: '', idea: '',
  nombre: '', fecha: '', hora: '', notas: '',
};
let pasoActual = 1; // 1 a 6 = pasos, 7 = resumen

// ===================== Ayudas =====================
function buscar(lista, id) { return lista.find(item => item.id === id); }

function escapar(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function fechaMinima() {
  const dia = new Date();
  dia.setDate(dia.getDate() + DIAS_ANTICIPACION);
  const mes = String(dia.getMonth() + 1).padStart(2, '0');
  const d = String(dia.getDate()).padStart(2, '0');
  return `${dia.getFullYear()}-${mes}-${d}`;
}

function fechaLegible(textoFecha) {
  if (!textoFecha) return '';
  const [anio, mes, dia] = textoFecha.split('-').map(Number);
  const fecha = new Date(anio, mes - 1, dia);
  const texto = fecha.toLocaleDateString('es-EC', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function horaLegible(textoHora) {
  if (!textoHora) return 'A coordinar';
  const [h, m] = textoHora.split(':').map(Number);
  const sufijo = h < 12 ? 'a. m.' : 'p. m.';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${sufijo}`;
}

function numeroDePedido() {
  const ahora = new Date();
  const p = n => String(n).padStart(2, '0');
  return `MEY-${p(ahora.getDate())}${p(ahora.getMonth() + 1)}-${p(ahora.getHours())}${p(ahora.getMinutes())}`;
}

// ===================== Dibujos =====================
function tortaRedonda(tamano, ancho) {
  let lineas = '';
  for (let i = 0; i < tamano.cortes; i++) {
    const angulo = (i / tamano.cortes) * Math.PI * 2;
    lineas += `<line x1="100" y1="100" x2="${100 + 90 * Math.cos(angulo)}" y2="${100 + 90 * Math.sin(angulo)}" stroke="#B3163F" stroke-width="1.5"/>`;
  }
  const chico = tamano.numero.length > 2;
  return `<svg viewBox="0 0 200 200" width="${ancho}" height="${ancho}">
    <circle cx="100" cy="100" r="90" fill="#FBD3DC" stroke="#B3163F" stroke-width="3"/>
    <path d="M100 10 A90 90 0 0 1 100 190 Z" fill="#F7A6B8"/>${lineas}
    <circle cx="100" cy="100" r="36" fill="#fff" stroke="#B3163F" stroke-width="2"/>
    <text x="100" y="${chico ? 110 : 113}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="${chico ? 26 : 34}" fill="#6E0E28">${tamano.numero}</text>
  </svg>`;
}

function tortaRectangular(tamano, ancho) {
  const w = 400, h = 170;
  let celdas = '';
  for (let c = 0; c < tamano.columnas; c++) {
    for (let f = 0; f < tamano.filas; f++) {
      const color = c < tamano.columnas / 2 ? '#FBD3DC' : '#F7A6B8';
      celdas += `<rect x="${c * w / tamano.columnas}" y="${f * h / tamano.filas}" width="${w / tamano.columnas}" height="${h / tamano.filas}" fill="${color}" stroke="#B3163F" stroke-width="1.5"/>`;
    }
  }
  return `<svg viewBox="-4 -4 408 178" width="${ancho}" height="${ancho * 178 / 408}">${celdas}
    <rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#B3163F" stroke-width="3"/>
    <circle cx="200" cy="85" r="38" fill="#fff" stroke="#B3163F" stroke-width="2"/>
    <text x="200" y="95" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="26" fill="#6E0E28">${tamano.numero}</text>
  </svg>`;
}

function dibujoTamano(tamano, ancho) {
  return tamano.forma === 'Redonda' ? tortaRedonda(tamano, ancho) : tortaRectangular(tamano, ancho);
}

function dibujoCobertura(id, ancho) {
  const base = id === 'chantilly' ? '#FFFDF8' : '#FFF1C9';
  let detalle = '';
  if (id === 'chantilly') {
    detalle = [40, 70, 100, 130, 160].map(x => `<path d="M${x - 14} 52 q14 -26 28 0" fill="#fff" stroke="#E2D6C6" stroke-width="3"/>`).join('');
  } else {
    detalle = [36, 60, 84, 108, 132, 156].map(x => `<circle cx="${x + 4}" cy="146" r="11" fill="#FFE3A0" stroke="#E2C27A" stroke-width="2"/>`).join('');
  }
  return `<svg viewBox="0 0 200 170" width="${ancho}" height="${ancho * 0.85}">
    <ellipse cx="100" cy="160" rx="92" ry="9" fill="#E9E3E5"/>
    <rect x="24" y="56" width="152" height="100" rx="10" fill="${base}" stroke="#B3163F" stroke-width="3"/>${detalle}
  </svg>`;
}

// ===================== Piezas de pantalla =====================
function cabecera(numero) {
  let barras = '';
  for (let i = 1; i <= PASOS.length; i++) {
    const clase = i < numero ? 'hecha' : (i === numero ? 'actual' : '');
    barras += `<div class="barra ${clase}"></div>`;
  }
  return `<div class="progreso"><div class="progreso-texto">PASO ${numero} DE ${PASOS.length}</div><div class="barras">${barras}</div></div>`;
}

// Tarjeta seleccionable. grupo = campo del pedido; modo = 'uno' o 'varios'
function tarjeta(grupo, modo, item, contenido) {
  const valor = pedido[grupo];
  const elegido = modo === 'uno' ? valor === item.id : valor.includes(item.id);
  return `<button type="button" class="opcion" data-grupo="${grupo}" data-modo="${modo}" data-valor="${item.id}" aria-pressed="${elegido}">${contenido}</button>`;
}

function tarjetaConFoto(grupo, modo, item) {
  return tarjeta(grupo, modo, item, `
    <img src="${IMAGENES[item.foto]}" alt="">
    <div class="opcion-nombre">${item.nombre}</div>
    ${item.desc ? `<div class="opcion-desc">${item.desc}</div>` : ''}`);
}

function campoTexto(campo, etiqueta, ayuda, ejemplo, tipo) {
  const valor = escapar(pedido[campo]);
  const control = tipo === 'area'
    ? `<textarea id="c_${campo}" data-campo="${campo}" placeholder="${ejemplo}">${valor}</textarea>`
    : `<input id="c_${campo}" type="${tipo || 'text'}" data-campo="${campo}" value="${valor}" placeholder="${ejemplo}" ${tipo === 'date' ? `min="${fechaMinima()}"` : ''}>`;
  return `<div class="campo"><label for="c_${campo}">${etiqueta}</label>${control}${ayuda ? `<small>${ayuda}</small>` : ''}</div>`;
}

// ===================== Los pasos =====================
function paso1Tamano() {
  const redondas = TAMANOS.filter(t => t.forma === 'Redonda').map(t => tarjeta('tamano', 'uno', t, `
    ${dibujoTamano(t, 76)}<div class="opcion-nombre">${t.nombre}</div>${t.detalle ? `<div class="opcion-desc">${t.detalle}</div>` : ''}`)).join('');
  const rectangulares = TAMANOS.filter(t => t.forma === 'Rectangular').map(t => tarjeta('tamano', 'uno', t, `
    ${dibujoTamano(t, 150)}<div class="opcion-nombre">${t.nombre}</div>`)).join('');
  return `${cabecera(1)}
    <div class="titulo">Tamaño</div>
    <p class="explica">¿Para cuántas porciones la necesitas?</p>
    <span class="pildora">Elige 1</span>
    <div class="subtitulo">Redonda</div>
    <div class="rejilla col-3">${redondas}</div>
    <div class="subtitulo">Rectangular <span class="explica" style="font-family:Nunito;font-size:14px">para eventos grandes</span></div>
    <div class="rejilla col-2">${rectangulares}</div>`;
}

function paso2Sabor() {
  return `${cabecera(2)}
    <div class="titulo">Sabor de la masa</div>
    <p class="explica">Es el bizcocho, la parte esponjosa de adentro.</p>
    <span class="pildora">Elige 1</span>
    <div class="rejilla col-2">${SABORES.map(s => tarjetaConFoto('sabor', 'uno', s)).join('')}</div>`;
}

function paso3Relleno() {
  const aviso = pedido.rellenos.length > 1
    ? `<div class="nota">Elegiste <b>${pedido.rellenos.length} rellenos</b>. Con más de un relleno el precio puede variar.</div>` : '';
  return `${cabecera(3)}
    <div class="titulo">Relleno</div>
    <p class="explica">Es la crema que va adentro, entre las capas de masa.</p>
    <span class="pildora">Normalmente 1</span><span class="pildora suave">Puedes pedir más (cambia el precio)</span>
    <div class="rejilla col-3">${RELLENOS.map(r => tarjetaConFoto('rellenos', 'varios', r)).join('')}</div>
    ${aviso}`;
}

function paso4CoberturaExtras() {
  const coberturas = COBERTURAS.map(c => tarjeta('cobertura', 'uno', c, `
    ${dibujoCobertura(c.id, 96)}<div class="opcion-nombre">${c.nombre}</div>
    <div class="opcion-desc">${c.desc}</div><div class="opcion-etiqueta">${c.etiqueta}</div>`)).join('');
  const extras = EXTRAS.map(e => e.foto
    ? tarjetaConFoto('extras', 'varios', e)
    : tarjeta('extras', 'varios', e, `<div style="width:78%;max-width:120px;aspect-ratio:1;margin:0 auto 6px;border-radius:50%;border:3px dashed #B3163F;display:flex;align-items:center;justify-content:center;font-size:36px;color:#B3163F;font-weight:900">✕</div><div class="opcion-nombre">${e.nombre}</div>`)
  ).join('');
  const lugares = bloqueLugaresDeExtras();
  return `${cabecera(4)}
    <div class="titulo">Cobertura y extras</div>
    <p class="explica">La cobertura envuelve la torta por fuera.</p>
    <div class="subtitulo">Cobertura <span class="pildora" style="vertical-align:middle">Elige 1</span></div>
    <div class="rejilla col-2">${coberturas}</div>
    <div class="subtitulo">Extras <span class="pildora suave" style="vertical-align:middle">Opcional</span></div>
    <p class="explica">Pueden ir encima, en la masa o en el relleno.</p>
    <div class="rejilla col-3">${extras}</div>
    ${lugares}
    <div class="nota">Si eliges gotas negras y blancas, van mezcladas.</div>`;
}

// Botones Encima / En la masa / En el relleno. "atributos" dice a qué parte del pedido pertenecen.
function chipsDeLugar(seleccionados, atributos) {
  return LUGARES_EXTRA.map(l => `<button type="button" class="chip" ${atributos} data-valor="${l.id}" aria-pressed="${seleccionados.includes(l.id)}">${l.nombre}</button>`).join('');
}

function extrasElegidos() {
  return pedido.extras.filter(id => id !== 'sin');
}

function bloqueLugaresDeExtras() {
  const elegidos = extrasElegidos();
  if (elegidos.length === 0) return '';

  // Un solo extra: solo se pregunta dónde va
  if (elegidos.length === 1) {
    return `<div class="subtitulo" style="font-size:19px">¿Dónde va el extra?</div>
      <p class="explica">Puedes elegir más de un lugar.</p>
      <div class="chips">${chipsDeLugar(pedido.lugaresExtra, 'data-grupo="lugaresExtra" data-modo="varios"')}</div>`;
  }

  // Dos o más extras: primero se elige si van en el mismo lugar o cada uno por separado
  const modos = [
    { id: 'iguales', nombre: 'Mismo lugar para todos' },
    { id: 'separados', nombre: 'Cada uno por separado' },
  ].map(m => `<button type="button" class="chip" data-grupo="modoLugares" data-modo="uno" data-valor="${m.id}" aria-pressed="${pedido.modoLugares === m.id}">${m.nombre}</button>`).join('');

  let detalle;
  if (pedido.modoLugares === 'iguales') {
    detalle = `<p class="explica" style="margin-top:12px">¿Dónde van todos los extras? Puedes elegir más de un lugar.</p>
      <div class="chips">${chipsDeLugar(pedido.lugaresExtra, 'data-grupo="lugaresExtra" data-modo="varios"')}</div>`;
  } else {
    detalle = `<p class="explica" style="margin-top:12px">Elige dónde va cada extra:</p>` + elegidos.map(id => {
      const item = buscar(EXTRAS, id);
      const lugaresDeEste = pedido.lugaresPorExtra[id] || [];
      return `<div class="lugar-extra">
        <img src="${IMAGENES[item.foto]}" alt="">
        <div><div class="opcion-nombre" style="text-align:left;margin-bottom:6px">${item.nombre}</div>
        <div class="chips">${chipsDeLugar(lugaresDeEste, `data-grupo="lugarDeExtra" data-extra="${id}"`)}</div></div>
      </div>`;
    }).join('');
  }
  return `<div class="subtitulo" style="font-size:19px">¿Dónde van los extras?</div>
    <div class="chips">${modos}</div>${detalle}`;
}

function paso5Decoracion() {
  const formas = FORMAS_DECORACION.map(f => tarjeta('decoracion', 'uno', f, `
    <div style="display:flex;align-items:center;gap:12px;text-align:left;padding:4px 6px">
      <div style="width:52px;height:52px;flex:none;border-radius:50%;background:#B3163F;display:flex;align-items:center;justify-content:center;font-size:26px">${f.icono}</div>
      <div><div class="opcion-nombre" style="font-size:19px">${f.nombre}</div><div class="opcion-desc" style="font-size:14px">${f.desc}</div></div>
    </div>`)).join('');
  let campos = '';
  if (pedido.decoracion === 'foto') {
    campos = `<div class="nota">Al final, envía tu resumen y <b>la foto de referencia</b> por WhatsApp.</div>`;
  }
  if (pedido.decoracion === 'idea') {
    campos = campoTexto('idea', 'Cuéntanos tu idea', 'Tema, personajes, estilo… lo que imagines.', 'Ej.: tema de mariposas, estilo delicado', 'area');
  }
  if (pedido.decoracion) {
    campos += campoTexto('ocasion', 'Ocasión', '', 'Ej.: cumpleaños, bautizo, aniversario')
      + campoTexto('texto', 'Texto que dirá la torta', 'Nombre y edad, o la frase que quieras.', 'Ej.: Feliz cumpleaños Sofía · 5 años')
      + campoTexto('colores', 'Colores', 'Si eliges «A su gusto», dinos 2 colores.', 'Ej.: rosado y dorado');
  }
  return `${cabecera(5)}
    <div class="titulo">Decoración</div>
    <p class="explica">Es cómo se ve tu torta: tema, colores y texto.</p>
    <span class="pildora">Elige 1 forma</span>
    <div class="rejilla">${formas}</div>
    ${campos}
    <div class="nota">Figuras, <b>topper</b> (adorno que va clavado encima) o foto comestible <b>tienen costo extra</b>.</div>`;
}

function paso6Datos() {
  return `${cabecera(6)}
    <div class="titulo">Tus datos</div>
    <p class="explica">Último paso: ¿a nombre de quién y para cuándo?</p>
    ${campoTexto('nombre', 'Nombre de quien hace el pedido', '', 'Ej.: María López')}
    ${campoTexto('fecha', 'Fecha en que la necesitas', `Pide con ${DIAS_ANTICIPACION} a 4 días de anticipación.`, '', 'date')}
    ${campoTexto('hora', 'Hora (opcional)', 'Si no sabes, la coordinamos por WhatsApp.', '', 'time')}
    ${campoTexto('notas', 'Algo más que debamos saber (opcional)', '', 'Ej.: retiro en el local, entrega a domicilio…', 'area')}`;
}

// ===================== Resumen final =====================
function filaResumen(etiqueta, fotos, valor, detalle) {
  return `<div class="fila">
    ${fotos ? `<div class="fila-fotos">${fotos}</div>` : ''}
    <div class="fila-texto"><div class="fila-etiqueta">${etiqueta}</div><div class="fila-valor">${valor}</div>${detalle ? `<div class="fila-detalle">${detalle}</div>` : ''}</div>
  </div>`;
}

function fotosDe(lista, ids) {
  return ids.map(id => buscar(lista, id)).filter(item => item && item.foto)
    .map(item => `<img src="${IMAGENES[item.foto]}" alt="">`).join('');
}

function nombresDeLugares(ids) {
  return ids.map(id => buscar(LUGARES_EXTRA, id).nombre.toLowerCase()).join(', ');
}

// Devuelve los extras elegidos y una línea por cada indicación de lugar
function textoExtras() {
  const elegidos = extrasElegidos();
  if (elegidos.length === 0) return { valor: 'Sin extra', lineas: [] };
  const nombres = elegidos.map(id => buscar(EXTRAS, id).nombre).join(', ');
  const porSeparado = elegidos.length > 1 && pedido.modoLugares === 'separados';
  if (porSeparado) {
    const lineas = elegidos.map(id => {
      const lugares = nombresDeLugares(pedido.lugaresPorExtra[id] || []);
      return `${buscar(EXTRAS, id).nombre}: ${lugares || 'a coordinar'}`;
    });
    return { valor: nombres, lineas };
  }
  const lugares = nombresDeLugares(pedido.lugaresExtra);
  const quien = elegidos.length > 1 ? 'Todos van' : 'Va';
  return { valor: nombres, lineas: [lugares ? `${quien}: ${lugares}` : 'Lugar: a coordinar'] };
}

function textoDecoracion() {
  const forma = buscar(FORMAS_DECORACION, pedido.decoracion);
  // Ocasión y colores van en la misma línea para que el resumen quepa en una captura del iPhone
  const primeraLinea = [];
  if (pedido.ocasion) primeraLinea.push(`Ocasión: ${escapar(pedido.ocasion)}`);
  if (pedido.colores) primeraLinea.push(`Colores: ${escapar(pedido.colores)}`);
  const detalles = [];
  if (primeraLinea.length) detalles.push(primeraLinea.join(' · '));
  if (pedido.texto) detalles.push(`Texto: «${escapar(pedido.texto)}»`);
  if (pedido.idea) detalles.push(`Idea: ${escapar(pedido.idea)}`);
  return { valor: forma.nombre, detalle: detalles.join('<br>') };
}

function pasoResumen() {
  const tamano = buscar(TAMANOS, pedido.tamano);
  const sabor = buscar(SABORES, pedido.sabor);
  const cobertura = buscar(COBERTURAS, pedido.cobertura);
  const rellenos = pedido.rellenos.map(id => buscar(RELLENOS, id).nombre).join(' + ');
  const extras = textoExtras();
  const decoracion = textoDecoracion();
  const ahora = new Date().toLocaleDateString('es-EC', { day: 'numeric', month: 'short', year: 'numeric' });
  return `
    <div class="resumen" id="resumen">
      <div class="resumen-cabecera">
        <img src="${IMAGENES.logo_batidora}" alt="">
        <div><div class="rc-marca">MEYMI</div><div class="rc-sub">¡Listo! Este es mi pedido</div></div>
        <div class="rc-numero">Pedido<b>${numeroDePedido()}</b>${ahora}</div>
      </div>
      <div class="resumen-cuerpo">
        ${filaResumen('Tamaño', dibujoTamano(tamano, 40), `${tamano.nombre} · ${tamano.forma.toLowerCase()}${tamano.detalle ? ' ' + tamano.detalle : ''}`, '')}
        ${filaResumen('Sabor de la masa', fotosDe(SABORES, [pedido.sabor]), sabor.nombre, '')}
        ${filaResumen(pedido.rellenos.length > 1 ? 'Rellenos' : 'Relleno', fotosDe(RELLENOS, pedido.rellenos), rellenos, '')}
        ${filaResumen('Cobertura', dibujoCobertura(cobertura.id, 40), cobertura.nombre, '')}
        ${filaResumen('Extras', fotosDe(EXTRAS, pedido.extras), extras.valor, extras.lineas.join('<br>'))}
        ${filaResumen('Decoración', '', decoracion.valor, decoracion.detalle)}
      </div>
      <div class="resumen-entrega">
        <div><div class="fila-etiqueta">A nombre de</div><div class="fila-valor">${escapar(pedido.nombre)}</div></div>
        <div><div class="fila-etiqueta">Hora</div><div class="fila-valor">${horaLegible(pedido.hora)}</div></div>
        <div style="grid-column:1 / -1"><div class="fila-etiqueta">Fecha de entrega</div><div class="fila-valor">${fechaLegible(pedido.fecha)}</div></div>
        ${pedido.notas ? `<div style="grid-column:1 / -1"><div class="fila-etiqueta">Notas</div><div class="fila-detalle">${escapar(pedido.notas)}</div></div>` : ''}
      </div>
      <div class="resumen-pie">Envía esta captura al WhatsApp <b>${WHATSAPP_VISIBLE}</b></div>
    </div>
    <p class="consejo">Toma captura de pantalla de la tarjeta y envíala por WhatsApp.<br>¿Algo no está bien? Toca <b>Editar</b> para volver a los pasos.</p>`;
}

// Mensaje de texto para el botón de WhatsApp
function mensajeWhatsapp() {
  const tamano = buscar(TAMANOS, pedido.tamano);
  const extras = textoExtras();
  const forma = buscar(FORMAS_DECORACION, pedido.decoracion);
  const lineas = [
    'Hola MEYMI, quiero pedir una torta:',
    `• Tamaño: ${tamano.nombre} (${tamano.forma.toLowerCase()})`,
    `• Sabor de la masa: ${buscar(SABORES, pedido.sabor).nombre}`,
    `• Relleno: ${pedido.rellenos.map(id => buscar(RELLENOS, id).nombre).join(' + ')}`,
    `• Cobertura: ${buscar(COBERTURAS, pedido.cobertura).nombre}`,
    `• Extras: ${extras.valor}`,
    ...extras.lineas.map(linea => `   - ${linea}`),
    `• Decoración: ${forma.nombre}`,
  ];
  if (pedido.ocasion) lineas.push(`• Ocasión: ${pedido.ocasion}`);
  if (pedido.texto) lineas.push(`• Texto: ${pedido.texto}`);
  if (pedido.colores) lineas.push(`• Colores: ${pedido.colores}`);
  if (pedido.idea) lineas.push(`• Idea: ${pedido.idea}`);
  lineas.push(`• Fecha: ${fechaLegible(pedido.fecha)}`, `• Hora: ${horaLegible(pedido.hora)}`, `• A nombre de: ${pedido.nombre}`);
  if (pedido.notas) lineas.push(`• Notas: ${pedido.notas}`);
  return lineas.join('\n');
}

// ===================== Validación de cada paso =====================
function errorDelPaso(numero) {
  if (numero === 1 && !pedido.tamano) return 'Elige un tamaño para continuar.';
  if (numero === 2 && !pedido.sabor) return 'Elige el sabor de la masa para continuar.';
  if (numero === 3 && pedido.rellenos.length === 0) return 'Elige al menos un relleno para continuar.';
  if (numero === 4 && !pedido.cobertura) return 'Elige la cobertura para continuar.';
  if (numero === 4 && pedido.extras.length === 0) return 'En extras, elige alguno o toca «Sin extra».';
  if (numero === 5 && !pedido.decoracion) return 'Elige una forma de decoración para continuar.';
  if (numero === 5 && pedido.decoracion === 'gusto' && !pedido.colores.trim()) return 'Para «A su gusto», escribe al menos los colores.';
  if (numero === 6 && !pedido.nombre.trim()) return 'Escribe el nombre de quien hace el pedido.';
  if (numero === 6 && !pedido.fecha) return 'Elige la fecha en que necesitas la torta.';
  if (numero === 6 && pedido.fecha < fechaMinima()) return `La fecha debe ser con al menos ${DIAS_ANTICIPACION} días de anticipación.`;
  return '';
}

// ===================== Dibujar pantalla y botones =====================
const contenedor = document.getElementById('paso');
const botones = document.getElementById('botones');
const cajaError = document.getElementById('error');

const PANTALLAS = [paso1Tamano, paso2Sabor, paso3Relleno, paso4CoberturaExtras, paso5Decoracion, paso6Datos, pasoResumen];

function mostrarError(texto) {
  cajaError.textContent = texto;
  cajaError.hidden = !texto;
}

function dibujar(subirArriba) {
  contenedor.innerHTML = PANTALLAS[pasoActual - 1]();
  // En el resumen se oculta la marca de arriba para que todo el pedido quepa en una captura
  document.querySelector('.marca').hidden = pasoActual === 7;
  document.body.classList.toggle('resumen-activo', pasoActual === 7);
  if (pasoActual === 7) {
    botones.innerHTML = `<button type="button" class="boton secundario" data-accion="editar">Editar</button>
      <button type="button" class="boton whatsapp" data-accion="whatsapp">Enviar por WhatsApp</button>`;
  } else {
    const atras = pasoActual > 1 ? `<button type="button" class="boton secundario" data-accion="atras">Atrás</button>` : '';
    const texto = pasoActual === 6 ? 'Ver mi pedido' : 'Siguiente';
    botones.innerHTML = `${atras}<button type="button" class="boton principal" data-accion="siguiente">${texto}</button>`;
  }
  if (subirArriba) window.scrollTo(0, 0);
  // Se revisa después de pintar (y otra vez cuando terminan de cargar las fotos)
  setTimeout(revisarSiHayMas, 60);
  setTimeout(revisarSiHayMas, 400);
}

// ===================== Aviso «Hay más abajo» =====================
const avisoMasAbajo = document.getElementById('masAbajo');
const MARGEN_FINAL = 40; // px: si falta menos que esto por ver, ya no se muestra el aviso

function revisarSiHayMas() {
  const barra = document.querySelector('.acciones');
  const altoBarra = document.body.classList.contains('resumen-activo') ? 0 : barra.offsetHeight;
  const finDeLoVisible = window.scrollY + window.innerHeight - altoBarra;
  const faltaPorVer = document.documentElement.scrollHeight - altoBarra - finDeLoVisible;
  const ocultar = pasoActual === 7
    || document.body.classList.contains('escribiendo')
    || faltaPorVer <= MARGEN_FINAL;
  avisoMasAbajo.style.bottom = (altoBarra + 12) + 'px';
  avisoMasAbajo.classList.toggle('oculto', ocultar);
}

avisoMasAbajo.addEventListener('click', () => {
  window.scrollBy({ top: Math.round(window.innerHeight * 0.6), behavior: 'smooth' });
});
window.addEventListener('scroll', revisarSiHayMas, { passive: true });
window.addEventListener('resize', revisarSiHayMas);

function elegir(grupo, modo, valor) {
  if (modo === 'uno') {
    pedido[grupo] = valor;
  } else if (pedido[grupo].includes(valor)) {
    pedido[grupo] = pedido[grupo].filter(v => v !== valor);
    // Al quitar un extra se olvida también su lugar
    if (grupo === 'extras') delete pedido.lugaresPorExtra[valor];
  } else if (grupo === 'extras' && valor === 'sin') {
    pedido.extras = ['sin'];
    pedido.lugaresExtra = [];
    pedido.lugaresPorExtra = {};
  } else {
    pedido[grupo] = pedido[grupo].filter(v => v !== 'sin').concat(valor);
  }
  // Si se cambia de forma de decoración y ya no es «idea», se borra la idea escrita
  if (grupo === 'decoracion' && valor !== 'idea') pedido.idea = '';
  mostrarError('');
  const posicion = window.scrollY;
  dibujar(false);
  window.scrollTo(0, posicion);
}

// Marca o desmarca un lugar (encima, masa, relleno) para un extra en particular
function alternarLugarDeExtra(extra, lugar) {
  const actuales = pedido.lugaresPorExtra[extra] || [];
  pedido.lugaresPorExtra[extra] = actuales.includes(lugar)
    ? actuales.filter(l => l !== lugar)
    : actuales.concat(lugar);
  const posicion = window.scrollY;
  dibujar(false);
  window.scrollTo(0, posicion);
}

contenedor.addEventListener('click', evento => {
  const boton = evento.target.closest('[data-grupo]');
  if (!boton) return;
  if (boton.dataset.grupo === 'lugarDeExtra') {
    alternarLugarDeExtra(boton.dataset.extra, boton.dataset.valor);
  } else {
    elegir(boton.dataset.grupo, boton.dataset.modo, boton.dataset.valor);
  }
});

// Teclado abierto en iPhone: la barra de botones deja de estar fija mientras se escribe
contenedor.addEventListener('focusin', evento => {
  if (evento.target.matches('input, textarea')) {
    document.body.classList.add('escribiendo');
    revisarSiHayMas();
  }
});
contenedor.addEventListener('focusout', () => {
  document.body.classList.remove('escribiendo');
  revisarSiHayMas();
});

function guardarCampo(evento) {
  const campo = evento.target.dataset.campo;
  if (campo) {
    pedido[campo] = evento.target.value;
    mostrarError('');
  }
}
// 'input' al escribir; 'change' porque en iPhone la fecha y la hora a veces solo avisan con 'change'
contenedor.addEventListener('input', guardarCampo);
contenedor.addEventListener('change', guardarCampo);

botones.addEventListener('click', evento => {
  const accion = evento.target.closest('[data-accion]');
  if (!accion) return;
  const tipo = accion.dataset.accion;
  if (tipo === 'siguiente') {
    const error = errorDelPaso(pasoActual);
    if (error) { mostrarError(error); return; }
    pasoActual++;
  }
  if (tipo === 'atras') pasoActual--;
  if (tipo === 'editar') pasoActual = 1;
  if (tipo === 'whatsapp') {
    const enlace = `https://wa.me/${WHATSAPP_INTERNACIONAL}?text=${encodeURIComponent(mensajeWhatsapp())}`;
    // Si Safari bloquea la ventana nueva, se abre en la misma pestaña
    const ventana = window.open(enlace, '_blank');
    if (!ventana) window.location.href = enlace;
    return;
  }
  mostrarError('');
  dibujar(true);
});

dibujar(true);
</script>
</body>
</html>
